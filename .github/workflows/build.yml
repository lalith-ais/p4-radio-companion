# Builds "P4 Radio Setup" for Windows, macOS (Apple silicon) and Linux.
# PyInstaller only builds for the system it runs on, so each is built on its own.
# Run it from the Actions tab ("Run workflow"), or push a tag such as v1.0.
# The programs are attached to the run as artifacts.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -r packaging/requirements.txt

      # Tests that need Linux, the firmware source or gcc skip themselves.
      # Every suite runs; each failing test becomes an annotation on the run
      # (readable without signing in). A failure still lets the build run, so
      # the program can be tried on that system.
      - name: Tests
        continue-on-error: true
        shell: bash
        run: |
          set +e +o pipefail      # GitHub runs bash with -e -o pipefail: a grep with no match would end the step
          rc=0
          for t in test_stick test_music test_probe test_gui; do
            python tests/$t.py > $t.log 2>&1 || rc=1
            tail -n 3 $t.log
            echo "::notice title=$t on $RUNNER_OS::$(grep -E '^Ran |^OK|^FAILED' $t.log | tr '\n' ' ')"
            grep -E '^(FAIL|ERROR): ' $t.log | while read -r line; do
              echo "::error title=$t on $RUNNER_OS::$line"
            done
            grep -E '^[A-Za-z]*Error: ' $t.log | head -n 3 | while read -r line; do
              echo "::error title=$t on $RUNNER_OS (detail)::$line"
            done
          done
          exit $rc

      - name: Build
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: P4-Radio-Setup-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/p4-radio-setup
          if-no-files-found: error
